name: Windows NSIS Release

# Per AGENTS.md hard constraint 1: all product work happens on the
# `tauri-rewrite` branch ONLY — `main` remains the pristine upstream
# baseline this branch was cut from. Never merge or copy from other
# branches (tauri-rebuild, copilot/*, arena/*, ...).
#
# Pipeline (ROADMAP.md Phase 0 + Phase 1):
#   1. build-workbench — compiles the original VS Code renderer on Windows
#      (Phase 0 baseline guard: the Electron/TypeScript tree must still
#      build) and assembles the client bundle: out/ + runtime node_modules
#      + product.json + nls.messages.json.
#   2. bundle-windows — builds the Tauri v2 / WebView2 shell around that
#      bundle and produces the NSIS installer (constraint 9: NSIS only).
#      The workbench is served through the in-process `vscode-file://`
#      custom protocol (constraint 11: no vscode-web, no HTTP server, no
#      background hosting — only static files read from disk by Rust).
#   3. release — publishes every successful bundle as a prerelease.

on:
  push:
    branches:
      - tauri-rewrite
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Compile-only baseline: the Electron binary and Playwright browsers are
  # not needed to compile the workbench. The Tauri shell uses WebView2,
  # which is preinstalled on windows-latest runners.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compile the original workbench renderer and assemble the client bundle
  #    (Phase 0 acceptance: original build runs on Windows CI; Phase 1
  #    input: the bundle the Tauri shell serves).
  # ---------------------------------------------------------------------------
  build-workbench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The monaco.d.ts build guard (build/lib/compilation.ts) compares the
      # generated declaration byte-wise against the checked-out file. The
      # repo normalizes text files to LF (.gitattributes `* text=auto`), but
      # a CRLF working tree (Windows autocrlf) makes a pristine checkout
      # fail that comparison. Renormalize the working tree to LF once,
      # right after checkout.
      - name: Force LF working tree
        shell: bash
        run: |
          set -euo pipefail
          echo "core.autocrlf before: $(git config --get core.autocrlf || echo unset)"
          git config core.autocrlf false
          git rm --cached -r . -q
          git reset --hard -q
          if grep -q $'\r' src/vs/monaco.d.ts; then
            echo "::error::monaco.d.ts still contains CRLF after renormalization"
            exit 1
          fi
          echo "monaco.d.ts is LF-clean"
          git status --short | head -5

      - name: Setup Node (repo .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # build/npm/preinstall.ts requires a VS C++ toolchain and probes
      # hardcoded `Microsoft Visual Studio/<2019|2022>/<Edition>` paths. The
      # runner image ships a newer layout, so resolve the real installation
      # via vswhere and satisfy the check through `vs2022_install` (the env
      # var only needs the path to exist — the version is not re-validated).
      - name: Locate Visual Studio (C/C++ toolchain for node-gyp)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere not found at $vswhere"; exit 1 }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error "no Visual Studio installation with the C++ workload found"; exit 1 }
          Write-Host "Visual Studio: $vs"
          "vs2022_install=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        shell: bash
        env:
          npm_config_foreground_scripts: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            if npm ci --no-audit --no-fund; then exit 0; fi
            echo "npm ci attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "::error::npm ci failed after 5 attempts"
          exit 1

      # Phase 0 guard: the original tree must keep typechecking while the
      # shell is being swapped underneath it.
      - name: Typecheck full src tree
        run: npm run typecheck-client

      - name: Compile workbench (gulp compile)
        run: npm run compile-client

      # codicon.ttf is copied into the source tree by build/lib/compilation.ts
      # during compile, but re-copy defensively when node_modules came from
      # cache (same guard upstream uses in gulpfile.editor.ts).
      - name: Ensure codicons present
        shell: bash
        run: |
          if [ ! -f out/vs/base/browser/ui/codicons/codicon/codicon.ttf ]; then
            echo "::warning::codicon.ttf missing after compile; copying from node_modules"
            mkdir -p out/vs/base/browser/ui/codicons/codicon
            cp node_modules/@vscode/codicons/dist/codicon.ttf out/vs/base/browser/ui/codicons/codicon/codicon.ttf
          fi

      - name: Assemble client bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cp -r out staging/out
          # Source maps are huge and not needed to boot the workbench.
          find staging/out -name '*.map' -delete

          # Runtime node_modules the renderer fetches through the
          # vscode-file protocol (wasm/oniguruma, language detection,
          # encoding). Anything missing beyond this list is a bug to fix in
          # the ipc/404 logs, not a silent skip.
          mkdir -p staging/node_modules/@vscode
          cp -r node_modules/vscode-oniguruma staging/node_modules/
          for pkg in vscode-regexp-languagedetection jschardet; do
            if [ -d "node_modules/$pkg" ]; then
              cp -r "node_modules/$pkg" staging/node_modules/
            else
              echo "::warning::optional runtime module not installed: $pkg"
            fi
          done
          if [ -d node_modules/@vscode/iconv-lite-umd ]; then
            cp -r node_modules/@vscode/iconv-lite-umd staging/node_modules/@vscode/
          else
            echo "::warning::optional runtime module not installed: @vscode/iconv-lite-umd"
          fi

          # Static resources referenced by the workbench.
          cp -r resources staging/resources

          # product.json + nls.messages.json are read by the Rust shell and
          # served into the window configuration (same shape the Electron
          # main process injects).
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const prod = JSON.parse(fs.readFileSync('product.json', 'utf8'));
          prod.version = pkg.version;
          prod.commit = process.env.GITHUB_SHA;
          prod.date = new Date().toISOString().slice(0, 10);
          fs.writeFileSync('staging/product.json', JSON.stringify(prod, null, 2));
          const nlsSource = fs.readFileSync('out/nls.messages.js', 'utf8');
          const match = nlsSource.match(/\[[\s\S]*\]/);
          if (!match) { throw new Error('cannot extract NLS messages array from out/nls.messages.js'); }
          const messages = JSON.parse(match[0]);
          if (!Array.isArray(messages) || messages.length === 0) { throw new Error('NLS messages array is empty or not an array'); }
          fs.writeFileSync('staging/nls.messages.json', JSON.stringify(messages));
          console.log('product.json:', prod.nameShort, prod.version, prod.commit);
          console.log('nls.messages.json:', messages.length, 'messages');
          NODE

      # Fail here, not on the user's desk: every file below is required for
      # the workbench to boot through the vscode-file protocol.
      - name: Assert client boot files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            staging/out/vs/code/electron-browser/workbench/workbench.html \
            staging/out/vs/code/electron-browser/workbench/workbench.js \
            staging/out/vs/workbench/workbench.desktop.main.js \
            staging/out/vs/workbench/workbench.desktop.main.css \
            staging/out/nls.messages.js \
            staging/out/vs/base/browser/ui/codicons/codicon/codicon.ttf \
            staging/node_modules/vscode-oniguruma/release/onig.wasm \
            staging/product.json \
            staging/nls.messages.json; do
            [ -f "$f" ] || { echo "::error::missing client boot file: $f"; exit 1; }
            echo "ok  $f"
          done

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: workbench-client
          path: staging/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Bundle the Windows NSIS installer (Tauri v2 + WebView2, only target
  #    per AGENTS.md constraint 9). Rust deps, the tauri-cli binary and the
  #    NSIS tooling are all cached.
  # ---------------------------------------------------------------------------
  bundle-windows:
    needs: build-workbench
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download client bundle
        uses: actions/download-artifact@v4
        with:
          name: workbench-client
          path: src-tauri/resources/client

      - name: Assert bundled client is complete
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            src-tauri/resources/client/out/vs/code/electron-browser/workbench/workbench.html \
            src-tauri/resources/client/out/vs/workbench/workbench.desktop.main.js \
            src-tauri/resources/client/product.json \
            src-tauri/resources/client/nls.messages.json; do
            [ -f "$f" ] || { echo "::error::client file missing in bundle: $f"; exit 1; }
          done

      - name: Install Rust (stable, cached)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows

      - name: Cache tauri-cli binary
        id: tacli
        uses: actions/cache@v4
        with:
          path: ~\.cargo\bin\cargo-tauri.exe
          key: tauri-cli-v2-windows-stable

      - name: Install tauri-cli
        if: steps.tacli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version '^2' --locked

      - name: Cache NSIS tooling
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-nsis-windows-v1

      # Constraint 9: Windows NSIS only. Constraint 11: the shell loads the
      # original workbench renderer natively through the in-process
      # vscode-file:// custom protocol — no server, no vscode-web build.
      - name: Build Windows bundle (NSIS only)
        run: cargo tauri build

      # Headless smoke: the exe verifies the bundled client boot files and
      # writes vstauri-smoke.out (GUI-subsystem binaries cannot rely on
      # stdout on Windows, so the report goes to a file).
      - name: Smoke test the built app
        shell: bash
        run: |
          set -euo pipefail
          EXE="src-tauri/target/release/vstauri.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::vstauri.exe not found; release dir contents:"
            ls src-tauri/target/release/ | head -30
            exit 1
          fi
          export VSTAURI_CLIENT_DIR="$PWD/src-tauri/resources/client"
          "$EXE" --vstauri-smoke
          cat vstauri-smoke.out
          grep -q "SMOKE OK" vstauri-smoke.out
          echo "SMOKE OK — bundled workbench client verified"

      - name: Upload Windows installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Release every successful bundle
  # ---------------------------------------------------------------------------
  release:
    needs: [build-workbench, bundle-windows]
    if: ${{ always() && needs.build-workbench.result == 'success' && needs.bundle-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Dev build ${{ github.run_number }} (tauri-rewrite)"
          body: |
            Automated build of `${{ github.sha }}` on `tauri-rewrite`.

            - **Windows**: `*-setup.exe` (NSIS)

            Phase 1 shell: the original VS Code workbench renderer served
            natively through the Tauri v2 `vscode-file://` custom protocol
            (WebView2). No Electron, no HTTP server, no vscode-web. The
            renderer boots against a native window configuration and an
            instrumented IPC bridge (`ipc-calls.jsonl` + `vstauri.log` in
            `%APPDATA%\VSTauri\logs`) that feeds the next phases.

            NOTE: Phase 1 scope is "workbench renders". Terminal, file
            dialogs, storage and extensions land in later phases (see
            ROADMAP.md); their IPC channels currently resolve to null and
            are logged.
          prerelease: true
          files: |
            dist/**/*.exe
