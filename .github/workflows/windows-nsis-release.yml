name: Windows NSIS Release

# Per AGENTS.md hard constraint 1: all product work happens on the
# `tauri-rewrite` branch ONLY — `main` remains the pristine upstream
# baseline this branch was cut from. Never merge or copy from other
# branches (tauri-rebuild, copilot/*, arena/*, ...).
#
# Pipeline (ROADMAP.md Phase 0 + Phase 1):
#   1. build-workbench — compiles the original VS Code renderer on Windows
#      (Phase 0 baseline guard: the Electron/TypeScript tree must still
#      build) and assembles the client bundle: out/ + runtime node_modules
#      + product.json + nls.messages.json.
#   2. bundle-windows — builds the Tauri v2 / WebView2 shell around that
#      bundle and produces the NSIS installer (constraint 9: NSIS only).
#      The workbench is served through the in-process `vscode-file://`
#      custom protocol (constraint 11: no vscode-web, no HTTP server, no
#      background hosting — only static files read from disk by Rust).
#   3. release — publishes every successful bundle as a prerelease.

on:
  push:
    branches:
      - tauri-rewrite
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Compile-only baseline: the Electron binary and Playwright browsers are
  # not needed to compile the workbench. The Tauri shell uses WebView2,
  # which is preinstalled on windows-latest runners.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compile the original workbench renderer and assemble the client bundle
  #    (Phase 0 acceptance: original build runs on Windows CI; Phase 1
  #    input: the bundle the Tauri shell serves).
  # ---------------------------------------------------------------------------
  build-workbench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 2 tripwire (ROADMAP.md "Minutes-to-Update"): the checked-in
      # compat/ipc-contract.json must match a fresh scan of the renderer IPC
      # surface. Fails when the upstream merge / any src change drifted the
      # surface without regenerating the contract — run
      # `node build/ipc-contract/extract-ipc-contract.mjs` and commit it.
      - name: IPC contract drift check
        shell: pwsh
        run: node build/ipc-contract/extract-ipc-contract.mjs --check

      # Compiled-output cache (the big speed lever for this pipeline). Exact
      # key only — no restore-keys, because a partial or stale out/ would
      # poison every downstream step. The key covers the complete compile
      # input surface: renderer sources, build pipeline scripts, npm
      # manifests and the pinned node version. The shell-transplant work
      # lives in src-tauri/ and .github/, so src/** is normally UNCHANGED
      # between pushes: typecheck + the ~15 min gulp compile are skipped
      # entirely. A full compile only runs when renderer inputs actually
      # change, and its result is saved for the next run.
      - name: Restore compiled out/ cache
        id: compile-cache
        uses: actions/cache@v4
        with:
          path: out
          key: compile-out-win-v1-${{ hashFiles('src/**', 'build/**', 'package.json', 'package-lock.json', '.nvmrc', 'gulpfile.js') }}

      # The monaco.d.ts build guard (build/lib/compilation.ts) compares the
      # generated declaration byte-wise against the checked-out file. The
      # repo normalizes text files to LF (.gitattributes `* text=auto`), but
      # a CRLF working tree (Windows autocrlf) makes a pristine checkout
      # fail that comparison. Renormalize the working tree to LF once,
      # right after checkout. Only needed when a compile will actually run.
      - name: Force LF working tree
        if: steps.compile-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "core.autocrlf before: $(git config --get core.autocrlf || echo unset)"
          git config core.autocrlf false
          git rm --cached -r . -q
          git reset --hard -q
          if grep -q $'\r' src/vs/monaco.d.ts; then
            echo "::error::monaco.d.ts still contains CRLF after renormalization"
            exit 1
          fi
          echo "monaco.d.ts is LF-clean"
          git status --short | head -5

      - name: Setup Node (repo .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Upstream's own node_modules cache mechanism (composite actions in
      # .github/actions/). Skips the ~18 min npm ci on every unchanged
      # package-lock — critical for fast iteration on this pipeline.
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-windows-tauri
          key-args: "win32 x64 $(node -p process.arch)"

      # build/npm/preinstall.ts requires a VS C++ toolchain and probes
      # hardcoded `Microsoft Visual Studio/<2019|2022>/<Edition>` paths. The
      # runner image ships a newer layout, so resolve the real installation
      # via vswhere and satisfy the check through `vs2022_install` (the env
      # var only needs the path to exist — the version is not re-validated).
      # Only needed when npm ci will actually run (node_modules cache miss).
      - name: Locate Visual Studio (C/C++ toolchain for node-gyp)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere not found at $vswhere"; exit 1 }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error "no Visual Studio installation with the C++ workload found"; exit 1 }
          Write-Host "Visual Studio: $vs"
          "vs2022_install=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: bash
        env:
          npm_config_foreground_scripts: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            if npm ci --no-audit --no-fund; then exit 0; fi
            echo "npm ci attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "::error::npm ci failed after 5 attempts"
          exit 1

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

      # postinstall normally downloads electron.d.ts into .build/typings/
      # (OUTSIDE node_modules, so the node_modules cache never carries it).
      # Only needed when the typechecker will run (compile inputs changed).
      - name: Ensure electron typings
        if: steps.compile-cache.outputs.cache-hit != 'true'
        shell: bash
        run: node build/npm/electronTypes.ts

      # Phase 0 guard: the original tree must keep typechecking while the
      # shell is being swapped underneath it. Skipped when out/ was restored
      # from cache: identical compile inputs cannot yield a new type error.
      - name: Typecheck full src tree
        if: steps.compile-cache.outputs.cache-hit != 'true'
        run: npm run typecheck-client

      - name: Compile workbench (gulp compile)
        if: steps.compile-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -uo pipefail
          if ! npm run compile-client; then
            echo "::warning::first compile attempt failed — usually the monaco.d.ts guard regenerating declarations (it writes the file, then errors). Retrying with the regenerated files in place."
            npm run compile-client
          fi

      - name: Save compiled out/ cache
        if: steps.compile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out
          key: compile-out-win-v1-${{ hashFiles('src/**', 'build/**', 'package.json', 'package-lock.json', '.nvmrc', 'gulpfile.js') }}

      - name: Compile cache hit
        if: steps.compile-cache.outputs.cache-hit == 'true'
        shell: bash
        run: echo "::notice::out/ restored from cache (src unchanged) — typecheck and compile skipped"; ls out | head -10

      # ---------------------------------------------------------------------------
      # PRODUCT client bundle (the startup-performance lever).
      #
      # The dev compile emits ~1000 individual ESM modules; the renderer
      # fetched every one of them through the vscode-file protocol on boot
      # (~1260 requests, 18-25s to first paint). The product esbuild bundle
      # (`build/next/index.ts bundle --target desktop --minify --nls`)
      # produces the exact minified, NLS-collected tree VS Code itself
      # ships: workbench.desktop.main.js/.css as single bundles, the
      # bootstrap entries, workers and Node mains (extension host, pty
      # host, file watcher — ready for the Phase 7 sidecar). Boot then
      # needs ~20 requests instead of ~1260.
      # ---------------------------------------------------------------------------
      - name: Restore bundled client cache
        id: client-bundle-cache
        uses: actions/cache@v4
        with:
          path: out-client
          key: client-bundle-win-v1-${{ hashFiles('src/**', 'build/**', 'product.json', 'package.json', 'package-lock.json') }}

      - name: Bundle product client (esbuild, minified, NLS)
        if: steps.client-bundle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # copy-codicons parity (build/lib/compilation.ts): the bundler
          # compiles CSS straight from src/, and codicon.css references
          # ./codicon.ttf. That file is gitignored and only exists after the
          # copy task — which the compile step normally performs, but the
          # compile cache hit skips it. Always copy it here (the exact
          # copyCodiconsImpl semantics).
          node -e "const fs=require('fs');const src='node_modules/@vscode/codicons/dist/codicon.ttf';if(!fs.existsSync(src)){console.error('codicon.ttf not found in node_modules');process.exit(1);}fs.mkdirSync('src/vs/base/browser/ui/codicons/codicon',{recursive:true});fs.copyFileSync(src,'src/vs/base/browser/ui/codicons/codicon/codicon.ttf');console.log('codicon.ttf copied into src tree');"
          node build/next/index.ts bundle --out out-client --minify --nls --target desktop

      - name: Save bundled client cache
        if: steps.client-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out-client
          key: client-bundle-win-v1-${{ hashFiles('src/**', 'build/**', 'product.json', 'package.json', 'package-lock.json') }}

      - name: Bundled client cache hit
        if: steps.client-bundle-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "::notice::out-client/ restored from cache (src unchanged) — bundle skipped"
          test -f out-client/vs/workbench/workbench.desktop.main.js
          test -f out-client/vs/code/electron-browser/workbench/workbench.js

      # -------------------------------------------------------------------
      # Copilot extension (AI provider bring-up).
      #
      # The built-in GitHub Copilot Chat extension carries the BYOK
      # language-model providers (extensions/copilot/src/extension/byok/
      # vscode-node/*Provider.ts — vendors: openai, anthropic, gemini, ollama,
      # openrouter, azure, xai, customoai [custom OpenAI base URL + key],
      # customendpoint). Its dist/ is gitignored and only this esbuild step
      # produces it. Shipping it + the Phase 7 node sidecar is what makes the
      # in-editor "manage models / connect provider" surface functional
      # WITHOUT any GitHub/Google sign-in: the user picks "Custom OpenAI
      # compatible", points it at their api base, pastes the key (stored
      # encrypted through the Mountain `encryption` channel), and the model
      # list is fetched from the provider's /v1/models endpoint.
      # -------------------------------------------------------------------
      - name: Restore copilot build cache
        id: copilot-cache
        uses: actions/cache@v4
        with:
          path: |
            extensions/copilot/dist
            extensions/copilot/node_modules
          key: copilot-dist-win-v2-${{ hashFiles('extensions/copilot/src/**', 'extensions/copilot/package.json', 'extensions/copilot/package-lock.json', 'extensions/copilot/.esbuild.mts') }}

      - name: Build copilot extension (BYOK AI providers)
        if: steps.copilot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix extensions/copilot ci
          npm --prefix extensions/copilot run build
          # Dev-only tooling out of the shipped tree (esbuild, tsx, tsc...):
          # prune to production runtime deps, the set upstream ships. The
          # dist bundle keeps @github/copilot (the CLI/SDK with its
          # win32-x64 binaries), node-pty and friends EXTERNAL, so the
          # pruned node_modules is a runtime requirement, not dead weight.
          npm --prefix extensions/copilot prune --omit=dev

      - name: Save copilot build cache
        if: steps.copilot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            extensions/copilot/dist
            extensions/copilot/node_modules
          key: copilot-dist-win-v2-${{ hashFiles('extensions/copilot/src/**', 'extensions/copilot/package.json', 'extensions/copilot/package-lock.json', 'extensions/copilot/.esbuild.mts') }}

      - name: Copilot cache hit
        if: steps.copilot-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "::notice::copilot dist/ restored from cache"
          test -f extensions/copilot/dist/extension.js
          test -d extensions/copilot/node_modules/@github/copilot
          echo "copilot node_modules size:"; du -sh extensions/copilot/node_modules

      # codicon.ttf is copied into the source tree by build/lib/compilation.ts
      # during compile, but re-copy defensively when node_modules came from
      # cache (same guard upstream uses in gulpfile.editor.ts).
      - name: Ensure codicons present
        shell: bash
        run: |
          if [ ! -f out/vs/base/browser/ui/codicons/codicon/codicon.ttf ]; then
            echo "::warning::codicon.ttf missing after compile; copying from node_modules"
            mkdir -p out/vs/base/browser/ui/codicons/codicon
            cp node_modules/@vscode/codicons/dist/codicon.ttf out/vs/base/browser/ui/codicons/codicon/codicon.ttf
          fi

      - name: Assemble client bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          # The PRODUCT tree: minified bundles + bootstrap entries + workers
          # + Node mains + copied resources, straight from the esbuild
          # bundle step. (The dev `out/` tree stays a build-time guard only.)
          cp -r out-client staging/out
          # Source maps are huge and not needed to boot the workbench;
          # strip both the files and the sourceMappingURL comments so the
          # webview never 404s them when devtools opens.
          find staging/out -name '*.map' -delete
          find staging/out -name '*.js' -exec sed -i -E '/^[[:space:]]*(\/\/# sourceMappingURL=|\/\*# sourceMappingURL=)/d' {} +

          # Runtime node_modules the renderer fetches through the
          # vscode-file protocol (wasm/oniguruma, language detection,
          # encoding). The product bundle keeps these as external imports
          # (esbuild `packages: 'external'`) resolved at runtime through the
          # node_modules.asar URL form — protocol.rs maps that prefix onto
          # this plain tree. Anything missing beyond this list is a bug to
          # fix in the ipc/404 logs, not a silent skip.
          mkdir -p staging/node_modules/@vscode
          cp -r node_modules/vscode-oniguruma staging/node_modules/
          for pkg in vscode-regexp-languagedetection jschardet; do
            if [ -d "node_modules/$pkg" ]; then
              cp -r "node_modules/$pkg" staging/node_modules/
            else
              echo "::warning::optional runtime module not installed: $pkg"
            fi
          done
          # External renderer dependencies the product bundle resolves at
          # runtime (observed as node_modules.asar 404s in the Phase 1 logs).
          # The FULL @xterm family is required: the integrated terminal's
          # renderer dynamically imports the addons (webgl/unicode11/
          # progress/clipboard/search/serialize/...) as
          # node_modules.asar/@xterm/addon-*/lib/*.js — the first Windows
          # runtime log showed those 404ing, which broke the terminal panel
          # before a single PTY byte could render. vscode-textmate feeds the
          # textmate tokenization worker bootstrap.
          for pkg in @vscode/vscode-languagedetection @vscode/iconv-lite-umd \
                     @xterm/xterm @xterm/headless @xterm/addon-webgl \
                     @xterm/addon-unicode11 @xterm/addon-progress \
                     @xterm/addon-clipboard @xterm/addon-search \
                     @xterm/addon-serialize @xterm/addon-ligatures \
                     @xterm/addon-image vscode-textmate; do
            if [ -d "node_modules/$pkg" ]; then
              mkdir -p "staging/node_modules/$(dirname "$pkg")"
              cp -r "node_modules/$pkg" "staging/node_modules/$pkg"
            else
              echo "::warning::optional runtime module not installed: $pkg"
            fi
          done

          # Static resources referenced by the workbench.
          cp -r resources staging/resources

          # codicon.ttf: the product bundle emits the font as an esbuild
          # asset (media/...); additionally keep the canonical path the
          # smoke test asserts and the dev tree used.
          mkdir -p staging/out/vs/base/browser/ui/codicons/codicon
          cp node_modules/@vscode/codicons/dist/codicon.ttf staging/out/vs/base/browser/ui/codicons/codicon/codicon.ttf

          # Built-in (system) extensions — the "app extensions" Electron ships
          # under resources/app/extensions. Data-only ones (theme-defaults,
          # language grammars, keymaps) work through the localFilesystem
          # channel immediately and give the workbench its default
          # themes/colors; code extensions are scanned and listed but stay
          # inactive until the extension host sidecar runs them (Phase 7 —
          # the node runtime now ships in resources/node, so the sidecar
          # manager can actually spawn extensionHostProcess). Test fixture
          # extensions (*-tests) are excluded like the product build.
          #
          # copilot IS staged (built above): it carries the BYOK AI
          # providers (openai/anthropic/gemini/ollama/openrouter/azure/xai/
          # customoai/customendpoint — custom OpenAI base URL + key, model
          # list from /v1/models). Its dist keeps @github/copilot and
          # node-pty EXTERNAL, so the pruned production node_modules ships
          # with it (upstream ships exactly that set).
          #
          # CRITICAL: every OTHER extension's node_modules must NOT be
          # staged. The node_modules cache (listNodeModules.ts) includes
          # every extensions/*/node_modules in the repo (~130k files /
          # ~800MB) — copying them all ballooned the artifact to 1GB and
          # made the artifact download flaky. They are build-time dev
          # dependencies. copilot's node_modules is the sole exception (it
          # is pruned to production deps in its build step).
          shopt -s dotglob nullglob
          mkdir -p staging/extensions
          for ext_dir in extensions/*/; do
            name=$(basename "$ext_dir")
            case "$name" in *-tests|*-test|copilot|node_modules) continue ;; esac
            # copilot is NOT staged into the artifact: with its production
            # node_modules (the @github/copilot CLI prebuilds) the client
            # artifact reaches ~365MB and the artifact download between jobs
            # turns flaky (blob timeouts after 5 retries — observed 2026-09-09).
            # It travels through the GitHub CACHE instead: the same
            # copilot-dist-win-v2 key is restored in bundle-windows and
            # copied into the client tree there, right before tauri build.
            mkdir -p "staging/extensions/$name"
            for entry in "$ext_dir"*; do
              if [ "$(basename "$entry")" != "node_modules" ]; then
                cp -r "$entry" "staging/extensions/$name/"
              fi
            done
          done
          shopt -u dotglob nullglob

          # CSS: the product bundle ships the real workbench.desktop.main.css
          # (the <link> in workbench.html loads it directly). css-modules.json
          # stays for smoke-test parity and potential dev-parity boots.
          mkdir -p staging/out/vs/workbench
          if [ ! -s staging/out/vs/workbench/workbench.desktop.main.css ]; then
            echo "::warning::product css missing from bundle; shipping empty placeholder"
            : > staging/out/vs/workbench/workbench.desktop.main.css
          fi
          find staging/out -name '*.css' -type f | sed 's|^staging/out/||' | sort > staging/css-modules.txt
          node -e "const fs=require('fs');const m=fs.readFileSync('staging/css-modules.txt','utf8').split('\n').filter(Boolean);if(m.length===0){throw new Error('no css modules found under out/');}fs.writeFileSync('staging/css-modules.json',JSON.stringify(m));console.log('css-modules.json:',m.length,'modules');"
          rm staging/css-modules.txt

          # product.json + nls.messages.json are read by the Rust shell and
          # served into the window configuration (same shape the Electron
          # main process injects).
          #
          # NLS: the product bundle (--nls) emits out-client/nls.messages.json
          # (message placeholders replaced with null + collected indices).
          # Fall back to the dev out/ copies, then to an empty array (dev
          # compile keeps English strings inline — src/vs/nls.ts fallback).
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const prod = JSON.parse(fs.readFileSync('product.json', 'utf8'));
          prod.version = pkg.version;
          prod.commit = process.env.GITHUB_SHA;
          prod.date = new Date().toISOString().slice(0, 10);
          fs.writeFileSync('staging/product.json', JSON.stringify(prod, null, 2));

          let messages = null;
          if (fs.existsSync('out-client/nls.messages.json')) {
            const parsed = JSON.parse(fs.readFileSync('out-client/nls.messages.json', 'utf8'));
            if (Array.isArray(parsed)) { messages = parsed; }
          }
          if (!messages && fs.existsSync('out/nls.messages.json')) {
            const parsed = JSON.parse(fs.readFileSync('out/nls.messages.json', 'utf8'));
            if (Array.isArray(parsed)) { messages = parsed; }
          }
          if (!messages && fs.existsSync('out/nls.messages.js')) {
            const nlsSource = fs.readFileSync('out/nls.messages.js', 'utf8');
            const match = nlsSource.match(/\[[\s\S]*\]/);
            if (match) {
              const parsed = JSON.parse(match[0]);
              if (Array.isArray(parsed)) { messages = parsed; }
            }
          }
          if (!messages) {
            console.log('::warning::no out/nls.messages.{json,js} produced by this compile; using empty NLS array (dev compile keeps English strings inline — see src/vs/nls.ts lookupMessage fallback)');
            messages = [];
          }
          fs.writeFileSync('staging/nls.messages.json', JSON.stringify(messages));
          console.log('product.json:', prod.nameShort, prod.version, prod.commit);
          console.log('nls.messages.json:', messages.length, 'messages');
          NODE

      # Diagnostic: what landed in out/ (root level) — helps catch layout
      # drift between build configurations early.
      - name: List out/ root (diagnostics)
        shell: bash
        run: ls out/ | head -40

      # Fail here, not on the user's desk: every file below is required for
      # the workbench to boot through the vscode-file protocol.
      - name: Assert client boot files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            staging/out/vs/code/electron-browser/workbench/workbench.html \
            staging/out/vs/code/electron-browser/workbench/workbench.js \
            staging/out/vs/workbench/workbench.desktop.main.js \
            staging/out/vs/workbench/workbench.desktop.main.css \
            staging/css-modules.json \
            staging/out/vs/base/browser/ui/codicons/codicon/codicon.ttf \
            staging/node_modules/vscode-oniguruma/release/onig.wasm \
            staging/product.json \
            staging/nls.messages.json \
            staging/extensions/theme-defaults/package.json \
            staging/extensions/theme-defaults/themes/dark_plus.json \
            staging/out/vs/workbench/contrib/terminal/common/scripts/shellIntegration.ps1 \
            staging/node_modules/@xterm/addon-webgl/lib/addon-webgl.js \
            staging/node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js \
            staging/node_modules/@xterm/xterm/lib/xterm.js; do
            [ -f "$f" ] || { echo "::error::missing client boot file: $f"; exit 1; }
            echo "ok  $f"
          done

      - name: Upload client bundle
        uses: actions/upload-artifact@v4
        with:
          name: workbench-client
          path: staging/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Bundle the Windows NSIS installer (Tauri v2 + WebView2, only target
  #    per AGENTS.md constraint 9). Rust deps, the tauri-cli binary and the
  #    NSIS tooling are all cached.
  # ---------------------------------------------------------------------------
  bundle-windows:
    needs: build-workbench
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download client bundle
        uses: actions/download-artifact@v4
        with:
          name: workbench-client
          path: src-tauri/resources/client

      # The Mountain sidecar manager (sidecar_channel.rs) runs the Electron
      # "utility process" roles — extension host, pty host, file watcher —
      # as plain Node.js child processes:
      #     node.exe <clientRoot>/vstauri-sidecar.mjs   (VSCODE_ESM_ENTRYPOINT=...)
      # The runtime is bundled at <install>/resources/node/node.exe and the
      # stdin/stdout framing wrapper is staged into the client bundle here
      # (the bundle-workbench job stages the client tree from `staging/`).
      - name: Stage sidecar wrapper into the client bundle
        shell: bash
        run: |
          set -euo pipefail
          cp src-tauri/sidecar/vstauri-sidecar.mjs src-tauri/resources/client/vstauri-sidecar.mjs
          test -f src-tauri/resources/client/vstauri-sidecar.mjs

      # Copilot rides the cache, not the artifact (see build-workbench):
      # same key, saved minutes ago by the upstream job. The dist +
      # production node_modules land in the client tree exactly where the
      # extension host will load them from.
      - name: Restore copilot build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            extensions/copilot/dist
            extensions/copilot/node_modules
          key: copilot-dist-win-v2-${{ hashFiles('extensions/copilot/src/**', 'extensions/copilot/package.json', 'extensions/copilot/package-lock.json', 'extensions/copilot/.esbuild.mts') }}
          fail-on-cache-miss: true

      - name: Stage copilot into the client bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f extensions/copilot/dist/extension.js || { echo "::error::copilot dist/extension.js missing from cache"; exit 1; }
          test -d extensions/copilot/node_modules/@github/copilot || { echo "::error::copilot runtime node_modules missing from cache"; exit 1; }
          mkdir -p src-tauri/resources/client/extensions/copilot
          # The runtime set: dist + production node_modules + manifests +
          # assets. The 49MB TypeScript source tree (src/), tests, docs and
          # the simulation-workbench .vscode/ dir are build-time only —
          # upstream does not ship them either.
          shopt -s dotglob
          for entry in extensions/copilot/*; do
            [ -e "$entry" ] || continue
            case "$(basename "$entry")" in
              src|test|test-web|docs|dist-sourcemaps|.vscode|.github|.git) continue ;;
              *) cp -r "$entry" src-tauri/resources/client/extensions/copilot/ ;;
            esac
          done
          shopt -u dotglob
          test -f src-tauri/resources/client/extensions/copilot/dist/extension.js
          echo "staged copilot:"; du -sh src-tauri/resources/client/extensions/copilot

      # Node.js runtime for the sidecar processes (pinned to the version the
      # shim advertises as process.versions.node — 22.17.0). NSIS compresses
      # it; ~80MB raw / ~25MB compressed. 22.14.0 was NOT new enough:
      # bootstrap-fork.js imports `registerHooks` from node:module, which
      # only exists from Node 22.15.0 — with 22.14.0 the sidecar died with
      # "SyntaxError: The requested module 'node:module' does not provide an
      # export named 'registerHooks'" and the extension host crash-looped
      # (each respawn flashing a console window).
      - name: Download Node.js runtime for the sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '22.17.0'
          New-Item -ItemType Directory -Force -Path src-tauri/resources/node | Out-Null
          $zip = Join-Path $env:TEMP "node-$version.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:TEMP "node-$version") -Force
          Copy-Item (Join-Path $env:TEMP "node-$version/node-v$version-win-x64/node.exe") src-tauri/resources/node/node.exe -Force
          if (-not (Test-Path src-tauri/resources/node/node.exe)) { throw "node.exe was not staged" }
          (Get-Item src-tauri/resources/node/node.exe).Length / 1MB

      - name: Assert bundled client is complete
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            src-tauri/resources/client/out/vs/code/electron-browser/workbench/workbench.html \
            src-tauri/resources/client/out/vs/workbench/workbench.desktop.main.js \
            src-tauri/resources/client/product.json \
            src-tauri/resources/client/nls.messages.json \
            src-tauri/resources/client/extensions/theme-defaults/themes/dark_plus.json \
            src-tauri/resources/client/extensions/copilot/dist/extension.js \
            src-tauri/resources/client/extensions/copilot/package.json \
            src-tauri/resources/client/vstauri-sidecar.mjs \
            src-tauri/resources/node/node.exe; do
            [ -f "$f" ] || { echo "::error::client file missing in bundle: $f"; exit 1; }
          done

      - name: Install Rust (stable, cached)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows

      # Mountain channel services (storage/logger/profiles/keyboardLayout/
      # nativeHost): the contract-shaped unit tests from the Phase 2/3
      # implementation round. Runs on the host before the bundle build.
      # Serial + nocapture: a hang prints the test name that blocked (the
      # suite is small, serial costs seconds). Hard timeout so a hang can
      # never burn the whole job.
      - name: Rust unit tests (Mountain channels + IPC codec)
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1 --nocapture
        timeout-minutes: 20

      - name: Cache tauri-cli binary
        id: tacli
        uses: actions/cache@v4
        with:
          path: ~\.cargo\bin\cargo-tauri.exe
          key: tauri-cli-v2-windows-stable

      - name: Install tauri-cli
        if: steps.tacli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version '^2' --locked

      - name: Cache NSIS tooling
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-nsis-windows-v1

      # Constraint 9: Windows NSIS only. Constraint 11: the shell loads the
      # original workbench renderer natively through the in-process
      # vscode-file:// custom protocol — no server, no vscode-web build.
      - name: Build Windows bundle (NSIS only)
        run: cargo tauri build

      # Headless smoke: the exe verifies the bundled client boot files and
      # writes vstauri-smoke.out (GUI-subsystem binaries cannot rely on
      # stdout on Windows, so the report goes to a file).
      - name: Smoke test the built app
        shell: bash
        run: |
          set -euo pipefail
          EXE="src-tauri/target/release/vstauri.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::vstauri.exe not found; release dir contents:"
            ls src-tauri/target/release/ | head -30
            exit 1
          fi
          export VSTAURI_CLIENT_DIR="$PWD/src-tauri/resources/client"
          "$EXE" --vstauri-smoke
          cat vstauri-smoke.out
          grep -q "SMOKE OK" vstauri-smoke.out
          echo "SMOKE OK — bundled workbench client verified"

      - name: Upload Windows installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Release every successful bundle
  # ---------------------------------------------------------------------------
  release:
    needs: [build-workbench, bundle-windows]
    if: ${{ always() && needs.build-workbench.result == 'success' && needs.bundle-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Dev build ${{ github.run_number }} (tauri-rewrite)"
          body: |
            Automated build of `${{ github.sha }}` on `tauri-rewrite`.

            - **Windows**: `*-setup.exe` (NSIS)

            VSTauri (by Mouri Younes) — the original VS Code workbench
            in a Tauri v2 native shell (WebView2, `vscode-file://`
            protocol). No Electron, no HTTP server, no vscode-web.

            This build ships: full file-system + watcher services, the
            integrated terminal backend (ConPTY) with the xterm renderer
            addons, editor state persistence + hot exit (window bounds,
            workspace session, unsaved-content backups), multi-window
            (agents window, `window.open` popups), the theme-aware
            "Starting…" boot splash, DPAPI-encrypted secret storage, the
            Node.js sidecar runtime (extension host bring-up) and the
            copilot extension with the BYOK AI providers (custom OpenAI
            base URL + key; models list from `/v1/models`; no
            GitHub/Google account required).

            Diagnostics: `vstauri.log` + `ipc-calls.jsonl` in
            `%APPDATA%\VSTauri\logs`. Remaining work is tracked in
            ROADMAP.md (extension host bring-up, search via ext host,
            debug/tasks, parity audit).
          prerelease: true
          files: |
            dist/**/*.exe
