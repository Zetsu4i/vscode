name: Windows NSIS Build and Release

on:
  push:
    branches: [arena/01a06ed6-vscode]
    tags:
     - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  UPSTREAM_REPO: microsoft/vscode

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # NOTE: Rust/Tauri steps are gated until src-tauri/ lands (ROADMAP.md Phase 1),
      # so pushes to main stay green before the Tauri shell exists.
      - name: Rust cache
        if: hashFiles('src-tauri/tauri.conf.json') != ''
        uses: swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build renderer/workbench
        run: npm run compile

      - name: Build Tauri NSIS
        if: hashFiles('src-tauri/tauri.conf.json') != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Locate NSIS installer
        if: hashFiles('src-tauri/tauri.conf.json') != ''
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Write-Output "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

 
      - name: Upload Windows installer (NSIS)
        if: hashFiles('src-tauri/tauri.conf.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vscode-tauri-installers-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Release every successful build
  # ---------------------------------------------------------------------------
  release:
    needs: [build-windows]
    if: ${{ always() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Dev build ${{ github.run_number }} (upstream)"
          body: |

            - **Windows**: `*-setup.exe` (NSIS)

            The bundled UI is the pristine Visual Studio Code web workbench
            served by the Rust backbone — no Electron, no Node runtime.
          prerelease: true
          files: |
            dist/**/*.exe
