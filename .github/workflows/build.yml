name: Build VSTauri

on:
  push:
    branches: [main, tauri-rebuild, native-rebuild]
  workflow_dispatch:

# Release target is Windows NSIS only — keep CI to exactly that so every
# push produces a testable installer fast (rust-cache keeps it minutes, not
# hours).
jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Build Windows installer (NSIS)
        run: npx tauri build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: vstauri-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
