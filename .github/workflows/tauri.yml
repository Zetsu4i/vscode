# Tauri migration — Phase 0 (see ROADMAP.md).
# NOTE: parked here because the sandbox's GitHub connection lacks the `workflows`
# permission. A maintainer should copy this file to `.github/workflows/tauri.yml`
# to activate it. It is the compile gate for Rust work (the dev sandbox has no
# crates.io egress).
name: Tauri Shell Checks

on:
  push:
    branches: ['arena/01a06ddd-vscode']
    paths: ['src-tauri/**', 'dist-tauri/**', '.github/workflows/tauri.yml']
  pull_request:
    paths: ['src-tauri/**', 'dist-tauri/**', '.github/workflows/tauri.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
            
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: vstauri-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: vstauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
