<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VSTauri</title>
    <style>
      html, body { height: 100%; margin: 0; background: #1f1f1f; color: #cccccc;
        font-family: 'Segoe UI', 'Ubuntu', sans-serif; display: flex;
        align-items: center; justify-content: center; }
      .box { text-align: center; }
      .spinner { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid #333;
        border-top-color: #0078d4; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <div>Starting VSTauri backbone…</div>
    </div>
  </body>
</html>
