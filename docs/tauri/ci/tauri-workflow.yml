# Tauri migration — Phase 0 (see ROADMAP.md).
# NOTE: parked here because the sandbox's GitHub connection lacks the `workflows`
# permission. A maintainer should copy this file to `.github/workflows/tauri.yml`
# to activate it. It is the compile gate for Rust work (the dev sandbox has no
# crates.io egress).
name: Tauri Shell Checks

on:
  push:
    branches: ['**']
    paths: ['src-tauri/**', 'dist-tauri/**', '.github/workflows/tauri.yml']
  pull_request:
    paths: ['src-tauri/**', 'dist-tauri/**', '.github/workflows/tauri.yml']

jobs:
  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: check
        run: cargo check --manifest-path src-tauri/Cargo.toml
