# Tauri migration — Phase 0/1/2 (see ROADMAP.md).
#
# Structure:
#   rust-check    — fast compile gate (fmt/clippy/check) on Windows/Linux/macOS
#   build-windows — full release build: web workbench + Tauri bundle (NSIS only) + GitHub release creation
name: Tauri Shell Checks

on:
  push:
    branches: ['arena/01a06e68-vscode', 'arena/*', 'main']
    paths:
      - 'src-tauri/**'
      - 'dist-tauri/**'
      - 'scripts/tauri/**'
      - 'src/**'
      - '.github/workflows/tauri.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'ROADMAP.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'dist-tauri/**'
      - 'scripts/tauri/**'
      - 'src/**'
      - '.github/workflows/tauri.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build-windows:
    needs: rust-check
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # .nvmrc requires Node 24 (repo preinstall enforces the major version)
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Full install (with lifecycle scripts) — all sub-dirs (extensions, remote/web, ...)
      # are handled by the repo postinstall. No `npx tsc --noEmit` here: this repo has no
      # root tsconfig; typechecking happens inside the web bundle task (tsgo).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `tauri build` runs `beforeBuildCommand` (npm run tauri:web) from tauri.conf.json,
      # which bundles the real VS Code web workbench into out/vscode-web.
      # Only NSIS bundle is built for Windows targets.
      - name: Build Tauri app (NSIS bundle only)
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          GOGC: 50
        run: npx tauri build --bundles nsis

      - name: Upload Windows artifacts (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: vstauri-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ format('Code - Tauri Windows Build #{0}', github.run_number) }}
          body: |
            Automated Release Build for Code - Tauri (Windows NSIS Installer).
            
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            This release contains the standalone NSIS installer package for Windows.
          draft: false
          prerelease: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
