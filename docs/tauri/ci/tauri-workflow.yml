# Tauri migration CI (see ROADMAP.md).
#
# ACTIVATION NOTE FOR MAINTAINERS: the automation connection in the dev
# sandbox cannot create or modify files under .github/workflows/. Copy THIS
# file over `.github/workflows/tauri.yml` to activate (one-time per change;
# the copy at .github/workflows/tauri.yml is the source of truth).
#   rust-check    — compile gate (fmt/clippy/check); currently windows-only per maintainer's minutes trade-off (restore Linux/macOS before Phase 5)
#   build-windows — full release build: web workbench + Tauri bundle + installer artifacts
name: Tauri Shell Checks

on:
  push:
    branches: ['arena/01a06ddd-vscode']
    paths: ['src-tauri/**', 'dist-tauri/**', 'scripts/tauri/**', '.github/workflows/tauri.yml']
  pull_request:
    paths: ['src-tauri/**', 'dist-tauri/**', 'scripts/tauri/**', '.github/workflows/tauri.yml']
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build-windows:
    needs: rust-check
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # .nvmrc requires Node 24 (repo preinstall enforces the major version)
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Full install (with lifecycle scripts) — all sub-dirs (extensions, remote/web, ...)
      # are handled by the repo postinstall. No `npx tsc --noEmit` here: this repo has no
      # root tsconfig; typechecking happens inside the web bundle task (tsgo).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `tauri build` runs `beforeBuildCommand` (npm run tauri:web) from tauri.conf.json,
      # which bundles the real VS Code web workbench into out/vscode-web.
      # Targets only NSIS for Windows installer.
      - name: Build Tauri app (with VS Code web workbench - NSIS only)
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          GOGC: 50
        run: npx tauri build --bundles nsis

      - name: Upload Windows artifacts (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: vstauri-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.event_name == 'push' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tauri-build-${{ github.run_number }}
          name: VS Code Tauri Pre-Release (Build ${{ github.run_number }})
          body: |
            ### Visual Studio Code on Tauri 2
            Automated build artifact.
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Artifact:** Windows NSIS Installer (`.exe`)
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
