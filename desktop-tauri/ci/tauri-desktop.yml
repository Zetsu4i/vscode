name: Tauri Desktop

# NOTE: copy this file to .github/workflows/tauri-desktop.yml to activate it
# (it lives in desktop-tauri/ci/ because pushing workflow files requires the
# GitHub `workflows` permission).
#
# Builds the Tauri-based desktop app (desktop-tauri/) for Linux, Windows and macOS.
# Each job:
#   1. compiles the VS Code server (vscode-reh-web) for the host platform
#   2. stages it into desktop-tauri/server-dist
#   3. compiles the Rust shell and produces installers via `tauri build`

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-tauri/**'
      - '.github/workflows/tauri-desktop.yml'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            bundles: |
              desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
              desktop-tauri/src-tauri/target/release/bundle/rpm/*.rpm
              desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows x64
            os: windows-latest
            bundles: |
              desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
              desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS arm64
            os: macos-14
            bundles: |
              desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
              desktop-tauri/src-tauri/target/release/bundle/macos/*.app

    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # VS Code native module deps
          sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3
          # Tauri (webkit/gtk) deps
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install repository dependencies
        run: npm ci

      - name: Build and stage VS Code server
        working-directory: desktop-tauri
        run: node scripts/prepare-server.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install Tauri CLI
        working-directory: desktop-tauri
        run: npm install

      - name: Generate platform icons
        working-directory: desktop-tauri
        run: npm run icons

      - name: Build Tauri app
        working-directory: desktop-tauri
        run: npm run build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: code-oss-tauri-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
