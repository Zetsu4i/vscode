[package]
name = "vscode-tauri"
version = "0.1.0"
description = "Tauri v2 shell for the VS Code workbench (Phase 1 prototype)"
edition = "2021"

# Tauri template default crate types (desktop uses rlib; staticlib/cdylib kept for future targets)
[lib]
name = "vscode_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
log = "0.4"
env_logger = "0.11"
