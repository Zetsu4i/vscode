[package]
name = "vstauri"
version = "1.138.0"
description = "Visual Studio Code - Tauri v2 native shell (Phase 1: workbench renderer via vscode-file:// custom protocol)"
authors = ["Zetsu4i"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools": allows opening WebView2 devtools in release builds — the
# workbench's F12 / Ctrl+Shift+I dev keybindings route through
# `vscode:toggleDevTools` (ipc.rs). Keep during bring-up; drop in Phase 11.
tauri = { version = "2", features = ["devtools"] }
serde_json = "1"
notify = "8"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
windows-sys = { version = "0.60", features = ["Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
# Keep default release settings; build speed matters for CI iteration.
# Optimization pass is a later roadmap phase (Phase 11).
