[package]
name = "vstauri"
version = "0.2.0"
description = "Visual Studio Code running on a Tauri 2 / Rust backbone"
authors = ["Zetsu4i"]
edition = "2021"
rust-version = "1.77"
default-run = "vstauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP + WebSocket backbone server (serves the vscode-web client and the bridge API)
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tower = "0.5"

# Real pseudo-terminal on every platform (ConPTY on Windows — headless, no console popups)
portable-pty = "0.8"

# File watching (debounced, recursive) — 0.3/6 combination is CI-proven
notify = "6"
notify-debouncer-full = "0.3"

# Native dialogs (open folder / open file) — no console windows
rfd = "0.15"

# Delete-to-trash support
trash = "5"

base64 = "0.22"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
