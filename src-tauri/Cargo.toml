[package]
name = "vstauri"
version = "0.1.0"
description = "A from-scratch VSCode-style workbench rebuilt on Tauri 2 + Rust"
authors = ["Zetsu4i"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vstauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
dirs = "5"

# Terminal: real pseudo-terminal on every platform (wezterm's battle-tested crate)
portable-pty = "0.8"

# File watching (debounced)
notify = "6"
notify-debouncer-full = "0.3"

# Search: ripgrep's engine (`regex`) + walker (`ignore`)
ignore = "0.4"
regex = "1"

# LSP client needs an async runtime for child processes
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
