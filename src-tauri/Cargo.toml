[package]
name = "code-tauri"
version = "0.1.0"
description = "VS Code workbench shell built on Tauri 2 (Phase 0 scaffold — see ROADMAP.md)"
edition = "2021"
publish = false

[lib]
name = "code_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
